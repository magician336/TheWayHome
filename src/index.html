<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分形树生成演示</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', sans-serif;
        }

        #main-app {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            background: #fff;
            /* 确保有背景色 */
        }

        /* 滚动视频展示区 */
        #scroll-display-section {
            position: relative;
            height: 200vh;
            /* 滚动总高度 */
            background: #1a1a1a;
            z-index: 20;
        }

        #video-sticky-container {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #scrollVideo {
            width: 80%;
            max-height: 80vh;
            /* 确保背景透明可见 */
            filter: drop-shadow(0 0 20px rgba(0, 2, 0, 0.5));
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            color: white;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        canvas {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            image-rendering: -webkit-optimize-contrast;
            /* 增强对比度和清晰度 */
            image-rendering: crisp-edges;
        }

        #controls {
            width: 300px;
            padding: 20px;
            background: #2c3e50;
            color: white;
            overflow-y: auto;
            height: 100vh;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #bdc3c7;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            float: right;
            font-weight: bold;
            color: #1abc9c;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #1abc9c;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #16a085;
        }

        #treeCanvas {
            max-width: 1000px;
            /* 强制锁定显示宽度 */
            max-height: 600px;
            width: 100%;
            /* 响应式适配 */
            height: auto;
            display: block;
        }
    </style>
</head>

<body>
    <div id="main-app">
        <div id="controls">
            <h2>年份数据对比</h2>
            <div class="control-group">
                <select id="yearSelect"></select>
            </div>
            <hr>
            <h2>实时参数微调</h2>
            <div id="inputs"></div>
            <button id="recordBtn">导出分段 WebM (透明)</button>
            <button id="animateBtn">播放生长动画</button>
            <button id="downloadBtn">下载 PNG</button>
            <button id="recordGrowthBtn" style="background-color: #e67e22;">录制 0-2017 生长过程</button>
        </div>

        <div id="canvas-container">
            <canvas id="treeCanvas" width="1000" height="600"></canvas>
        </div>
    </div>

    <div id="scroll-display-section">
        <div id="video-sticky-container">
            <div class="scroll-hint">向下滚动查看演化细节 ↓</div>
            <video id="scrollVideo" muted playsinline preload="auto">
                <source src="tree_17-18.webm" type="video/webm">
            </video>
        </div>
    </div>

    <script type="module" src="./main.js"></script>
</body>

</html>
